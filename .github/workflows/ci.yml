name: CI

# Triggering matrix
# ─────────────────────────────────────────────────────────
# Workflow     | Paths                                         | Purpose
# ─────────────|───────────────────────────────────────────────|────────────────────
# ci.yml       | sdk/, relayer/, solver/, mempool/,            | TypeScript build,
#              | package.json, package-lock.json, .nvmrc,       | test, and lint
#              | tsconfig.base.json, .github/workflows/ci.yml   |
# evm.yml      | contracts/evm/**                               | Solidity build,
#              | .github/workflows/evm.yml                      | test, and Slither
# soroban.yml  | contracts/soroban/**                           | Rust build, test,
#              | .github/workflows/soroban.yml                  | and clippy
# coverage.yml | sdk/, relayer/, solver/, mempool/,             | Per-stack coverage
#              | contracts/soroban/**, contracts/evm/**,        | (ts/soroban/evm),
#              | package.json, package-lock.json, .nvmrc,       | scoped per job via
#              | tsconfig.base.json,                            | dorny/paths-filter
#              | .github/workflows/coverage.yml                 |
# diff-fuzz.yml| (all paths; schedule + dispatch)               | Differential fuzz
#              |                                                | + cross-validation
# pr-lint.yml  | (all PRs)                                      | Conventional-
#              |                                                | commit title check
# ─────────────────────────────────────────────────────────
# docs/ and root .md changes trigger the ci.yml check job so
# branch protection sees a green gate — no heavy test suite runs.

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "scripts/check-spdx-headers.sh"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "scripts/check-spdx-headers.sh"
      - "docs/**"
      - "*.md"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out, build, and test.
permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package.json
            relayer/package.json
            solver/package.json
            mempool/package.json

      - name: Install dependencies
        run: npm ci

      - name: Check SPDX license headers
        run: ./scripts/check-spdx-headers.sh

      - name: Build all packages
        run: make build-ts

      - name: Run tests
        run: make test-ts

  e2e:
    name: End-to-end tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: make build-ts

      - name: Run end-to-end tests
        run: make test-e2e

  # Guard against manifest-only edits: if package.json changes without a
  # matching package-lock.json update, `npm ci` fails everywhere downstream.
  # This job fails fast with a clear message instead of letting every other
  # job die on the same error.
  lock-sync:
    name: Lock file in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify package-lock.json satisfies package.json
        run: |
          npm ci --dry-run
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' on the pinned Node version and commit the updated lock file."
            exit 1
          fi

      - name: Verify qs override is applied
        run: |
          npm ls qs
          if npm ls qs --json | grep -q '"version": "6\.1[0-5]\.'; then
            echo "::error::qs is locked below the ^6.16.0 override."
            exit 1
          fi

  # Required gate for branch protection.
  #
  # This job is the ONLY check registered in GitHub's required-status-checks.
  # It deliberately gates on `typescript`, `e2e`, and `lock-sync` so a build
  # failure or an out-of-sync lock is always visible to branch protection,
  # while still passing green when the path filter skips those jobs entirely
  # (e.g. a docs-only PR that doesn't touch sdk/**).
  #
  # Behaviour matrix:
  #   typescript ran and passed  → check passes  ✅
  #   typescript ran and failed  → check fails   ❌  (build broken, merge blocked)
  #   typescript was skipped     → check passes  ✅  (path filter, docs-only PR)
  #   e2e ran and passed         → check passes  ✅
  #   e2e ran and failed         → check fails   ❌  (e2e broken, merge blocked)
  #   e2e was skipped            → check passes  ✅  (path filter, docs-only PR)
  #   lock-sync ran and passed   → check passes  ✅
  #   lock-sync ran and failed   → check fails   ❌  (lock out of sync, merge blocked)
  check:
    name: Required check
    runs-on: ubuntu-latest
    needs: [typescript, e2e, lock-sync]
    if: always()
    steps:
      - name: Assert typescript, e2e, and lock-sync passed or were skipped
        run: |
          for result in "${{ needs.typescript.result }}" "${{ needs.e2e.result }}" "${{ needs.lock-sync.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A job $result — merge is blocked."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped — gate passes."
