name: CI

# Triggering matrix
# ─────────────────────────────────────────────────────────
# Every workflow below runs on every PR to main; path filtering
# happens INSIDE each workflow (a `changes` job using
# dorny/paths-filter) so the required gate job always reports a
# conclusion. Workflow-level `on.*.paths` filters are avoided
# because a filtered-out PR never creates a run, leaving required
# checks stuck in "Expected — Waiting for status to be reported".
#
# Workflow     | Internal filter (paths)                       | Purpose
# ─────────────|───────────────────────────────────────────────|────────────────────
# ci.yml       | sdk/, relayer/, solver/, mempool/,            | TypeScript build,
#              | package.json, package-lock.json, .nvmrc,       | test, and lint
#              | tsconfig.base.json, .github/workflows/ci.yml,  |
#              | scripts/check-spdx-headers.sh, docs/**, *.md   |
# evm.yml      | contracts/evm/**                               | Solidity build,
#              | .github/workflows/evm.yml                      | test, and Slither
# soroban.yml  | contracts/soroban/**                           | Rust build, test,
#              | .github/workflows/soroban.yml                  | and clippy
# coverage.yml | sdk/, relayer/, solver/, mempool/,             | Per-stack coverage
#              | contracts/soroban/**, contracts/evm/**,        | (ts/soroban/evm),
#              | package.json, package-lock.json, .nvmrc,       | scoped per job via
#              | tsconfig.base.json,                            | dorny/paths-filter
#              | .github/workflows/coverage.yml                 |
# diff-fuzz.yml| (all paths; schedule + dispatch)               | Differential fuzz
#              |                                                | + cross-validation
# pr-lint.yml  | (all PRs)                                      | Conventional-
#              |                                                | commit title check
# ─────────────────────────────────────────────────────────
# Required gates: `CI / required`, `EVM / required`,
# `Soroban / required`. Each is a job-level gate that passes green
# when its internal path filter skips the heavy jobs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out, build, and test.
permissions:
  contents: read

jobs:
  # Detect which stacks changed. Runs on every PR so the gate job
  # below always has a conclusion to report.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          filters: |
            ts:
              - "sdk/**"
              - "relayer/**"
              - "solver/**"
              - "mempool/**"
              - "package.json"
              - "package-lock.json"
              - ".nvmrc"
              - "tsconfig.base.json"
              - ".github/workflows/ci.yml"
              - "scripts/check-spdx-headers.sh"
              - "docs/**"
              - "*.md"

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ts == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package.json
            relayer/package.json
            solver/package.json
            mempool/package.json

      - name: Install dependencies
        run: npm ci

      - name: Check SPDX license headers
        run: ./scripts/check-spdx-headers.sh

      - name: Build all packages
        run: make build-ts

      - name: Run tests
        run: make test-ts

  e2e:
    name: End-to-end tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ts == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: make build-ts

      - name: Run end-to-end tests
        run: make test-e2e

  # Required gate for branch protection: `CI / required`.
  #
  # This job is the ONLY check from this workflow registered in GitHub's
  # required-status-checks. It gates on `typescript` and `e2e` so a build
  # failure is always visible to branch protection, while still passing green
  # when the internal `changes` filter skips those jobs (e.g. a docs-only PR).
  #
  # Behaviour matrix (job-level skipping, not workflow-level):
  #   typescript ran and passed  → gate passes  ✅
  #   typescript ran and failed  → gate fails   ❌  (build broken, merge blocked)
  #   typescript was skipped     → gate passes  ✅  (path filter, docs-only PR)
  #   e2e ran and passed         → gate passes  ✅
  #   e2e ran and failed         → gate fails   ❌  (e2e broken, merge blocked)
  #   e2e was skipped            → gate passes  ✅  (path filter, docs-only PR)
  required:
    name: CI / required
    runs-on: ubuntu-latest
    needs: [typescript, e2e]
    if: always()
    steps:
      - name: Assert typescript and e2e passed or were skipped
        run: |
          for result in "${{ needs.typescript.result }}" "${{ needs.e2e.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A job $result — merge is blocked."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped — gate passes."
