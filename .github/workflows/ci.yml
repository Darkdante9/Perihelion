name: CI

# Triggering matrix
# ─────────────────────────────────────────────────────────
# Workflow     | Paths                                         | Purpose
# ─────────────|───────────────────────────────────────────────|────────────────────
# ci.yml       | sdk/, relayer/, solver/, mempool/,            | TypeScript build,
#              | package.json, package-lock.json, .nvmrc,       | test, and lint
#              | tsconfig.base.json, .github/workflows/ci.yml   |
# evm.yml      | contracts/evm/**                               | Solidity build,
#              | .github/workflows/evm.yml                      | test, and Slither
# soroban.yml  | contracts/soroban/**                           | Rust build, test,
#              | .github/workflows/soroban.yml                  | and clippy
# coverage.yml | sdk/, relayer/, solver/, mempool/,             | Per-stack coverage
#              | contracts/soroban/**, contracts/evm/**,        | (ts/soroban/evm),
#              | package.json, package-lock.json, .nvmrc,       | scoped per job via
#              | tsconfig.base.json,                            | dorny/paths-filter
#              | .github/workflows/coverage.yml                 |
# diff-fuzz.yml| (all paths; schedule + dispatch)               | Differential fuzz
#              |                                                | + cross-validation
# pr-lint.yml  | (all PRs)                                      | Conventional-
#              |                                                | commit title check
# ─────────────────────────────────────────────────────────
# docs/ and root .md changes trigger the ci.yml check job so
# branch protection sees a green gate — no heavy test suite runs.
# The `changes` job (dorny/paths-filter) decides whether the heavy
# `typescript` and `e2e` jobs run; `check` always reports.

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "docker/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "docker/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "*.md"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out, build, and test.
permissions:
  contents: read

jobs:
  # Detect whether the heavy jobs need to run. Docs-only and root .md
  # changes leave `typescript` false, so the build/test matrix is skipped
  # while the `check` gate still reports green.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            typescript:
              - "sdk/**"
              - "relayer/**"
              - "solver/**"
              - "mempool/**"
              - "test/**"
              - "docker/**"
              - "scripts/**"
              - "Makefile"
              - "package.json"
              - "package-lock.json"
              - ".nvmrc"
              - "tsconfig.base.json"
              - ".github/workflows/ci.yml"

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package.json
            relayer/package.json
            solver/package.json
            mempool/package.json

      - name: Install dependencies
        run: npm ci

      - name: Check SPDX license headers
        run: ./scripts/check-spdx-headers.sh

      - name: Build all packages
        run: make build-ts

      - name: Run tests
        run: make test-ts

  e2e:
    name: End-to-end tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: make build-ts

      - name: Run end-to-end tests
        run: make test-e2e

  # Required gate for branch protection.
  #
  # This job is the ONLY check registered in GitHub's required-status-checks.
  # It deliberately gates on `typescript` and `e2e` so a build failure is always
  # visible to branch protection, while still passing green when the path filter
  # skips those jobs entirely (e.g. a docs-only PR that doesn't touch sdk/**).
  #
  # Behaviour matrix:
  #   typescript ran and passed  → check passes  ✅
  #   typescript ran and failed  → check fails   ❌  (build broken, merge blocked)
  #   typescript was skipped     → check passes  ✅  (path filter, docs-only PR)
  #   e2e ran and passed         → check passes  ✅
  #   e2e ran and failed         → check fails   ❌  (e2e broken, merge blocked)
  #   e2e was skipped            → check passes  ✅  (path filter, docs-only PR)
  check:
    name: Required check
    runs-on: ubuntu-latest
    needs: [changes, typescript, e2e]
    if: always()
    steps:
      - name: Assert typescript and e2e passed or were skipped
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.typescript.result }}" "${{ needs.e2e.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A job $result — merge is blocked."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped — gate passes."
